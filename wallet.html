<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 Panda Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* =========================================
           ESTILOS PANDA WALLET
           ========================================= */
        body {
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; max-width: 100%;
            overflow-x: hidden; overflow-y: auto;
            background-color: var(--bg-dark);
            box-sizing: border-box;
        }
        .wallet-container {
            width: 100%; max-width: 700px;
            animation: fadeUp 0.6s ease-out backwards;
        }
        /* CABECERA */
        .wallet-header {
            text-align: center; margin-bottom: 30px;
            animation: fadeDown 0.8s ease-out backwards;
        }
        .wallet-header h1 {
            font-size: 2.5rem; font-weight: 900; margin: 0 0 5px 0;
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.3));
        }
        .wallet-header .subtitle {
            color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase; margin: 0;
        }
        /* TARJETA DE SALDO PRINCIPAL */
        .balance-card {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(245, 158, 11, 0.25);
            backdrop-filter: blur(25px); border-radius: 24px;
